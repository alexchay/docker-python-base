# a matrix list of variables used in the container build process
.parallel_matrix:
    parallel:
      matrix:
        - BASE_IMAGE_NAME: "docker.io/library/python"
          BASE_IMAGE_TAG: "3.11-slim"
          BUILD_IMAGE_NAME: "python-base"
          BUILD_IMAGE_TAG: "3.11-slim"
          BUILD_IMAGE_TAGS: "3.11-slim, 3.11"
        - BASE_IMAGE_NAME: "docker.io/library/python"
          BASE_IMAGE_TAG: "3.12-slim"
          BUILD_IMAGE_NAME: "python-base"
          BUILD_IMAGE_TAG: "3.12-slim"
          BUILD_IMAGE_TAGS: "3.12-slim, 3.12"
        - BASE_IMAGE_NAME: "docker.io/library/python"
          BASE_IMAGE_TAG: "3.13-slim"
          BUILD_IMAGE_NAME: "python-base"
          BUILD_IMAGE_TAG: "3.13-slim"
          BUILD_IMAGE_TAGS: "3.13-slim, 3.13"
        - BASE_IMAGE_NAME: "docker.io/library/python"
          BASE_IMAGE_TAG: "3.14-slim"
          BUILD_IMAGE_NAME: "python-base"
          BUILD_IMAGE_TAG: "3.14-slim"
          BUILD_IMAGE_TAGS: "3.14-slim, 3.14"
